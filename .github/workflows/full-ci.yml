name: Full CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read toolchain pin
        id: toolchain
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.toolchain.outputs.version }}
          cache-key: full-ci-native-${{ matrix.platform.name }}-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check *.zig domain/

      - name: Check source boundary and dependency pin
        run: python3 scripts/check-layout.py

      - name: Validate host PGSO corpus
        working-directory: vendor/fx
        run: python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list

      - name: Audit public surface
        working-directory: vendor/fx
        run: ./scripts/check-public-surface.sh

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Run unit tests
        run: zig build test-host -Doptimize=${{ matrix.optimize }}

      - name: Smoke test fresh binary
        shell: bash
        run: |
          help_stdout="$(mktemp)"
          help_stderr="$(mktemp)"
          status_stdout="$(mktemp)"
          status_stderr="$(mktemp)"
          trap 'rm -f "$help_stdout" "$help_stderr" "$status_stdout" "$status_stderr"' EXIT

          ./zig-out/bin/fx help >"$help_stdout" 2>"$help_stderr"
          test -s "$help_stdout"
          test ! -s "$help_stderr"

          ./zig-out/bin/fx status --json >"$status_stdout" 2>"$status_stderr"
          test -s "$status_stdout"
          test ! -s "$status_stderr"

  e2e:
    name: E2E (${{ matrix.optimize }}, ${{ matrix.platform.name }}, shard ${{ matrix.shard.label }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
        optimize: [ReleaseSafe]
        shard:
          - index: 0
            shard_count: 4
            label: "1/4"
          - index: 1
            shard_count: 4
            label: "2/4"
          - index: 2
            shard_count: 4
            label: "3/4"
          - index: 3
            shard_count: 4
            label: "4/4"
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_REQUIRE_TMUX: "1"
      FX_ORCHESTRATION_E2E: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read toolchain pin
        id: toolchain
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.toolchain.outputs.version }}
          use-cache: false

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E system dependencies
        shell: bash
        timeout-minutes: 17
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            missing=()
            command -v tmux >/dev/null 2>&1 || missing+=(tmux)
            command -v zsh >/dev/null 2>&1 || missing+=(zsh)
            if [ "${#missing[@]}" -gt 0 ]; then
              retry() {
                local attempt
                for attempt in 1 2; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$attempt" -lt 2 ]; then
                    printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                    sleep 5
                  fi
                done
                return 1
              }
              # The Azure mirror can stall after APT has already fetched release
              # metadata from the direct Ubuntu fallback. Prefer that fallback
              # for the whole update when the runner's mirror list provides it.
              if [ -f /etc/apt/apt-mirrors.txt ] &&
                grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
              then
                sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
              fi
              retry sudo timeout --kill-after=15s 4m apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              retry sudo timeout --kill-after=15s 3m apt-get \
                -o Dpkg::Use-Pty=0 \
                install -y "${missing[@]}"
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: vendor/fx/tests/e2e

      - name: Run deterministic host and product E2E shard
        run: scripts/test-host-e2e-shard.sh "$SHARD_INDEX" "$SHARD_COUNT"

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() }}
    needs:
      - native
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Verify native and E2E matrices
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            ([
              "Native checks (ReleaseSafe, " + $target + ")",
              (range(1; 5) as $shard
                | "E2E (ReleaseSafe, " + $target + ", shard " + ($shard | tostring) + "/4)")
            ] | sort) as $expected
            |
            [
              .jobs[]
              | select(
                  (.name == ("Native checks (ReleaseSafe, " + $target + ")")) or
                  (.name | startswith("E2E (ReleaseSafe, " + $target + ", shard "))
              )
            ] as $selected
            | (($selected | map(.name) | sort) == $expected and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"
